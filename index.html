<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autencefy Verify</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:20px 0}
.box{text-align:center;padding:30px;border:1px solid #333;border-radius:10px;background:#1a1a1a;max-width:500px;width:90%}
input{padding:10px;font-size:16px;border-radius:5px;border:1px solid #555;background:#222;color:#fff;width:150px;text-align:center}
button{margin-top:15px;padding:10px 25px;font-size:16px;background:#1a73e8;color:#fff;border:none;border-radius:5px}
#result{margin-top:20px;display:none;text-align:left}
table{width:100%;border-collapse:collapse;margin-top:15px}
td{border:1px solid #333;padding:12px;font-size:15px}
td.label{font-weight:bold;width:40%;background:#222}
</style>
</head>
<body>
<div class="box">
<h2>Autencefy Verify</h2>
<div id="loginBox">
<p>Enter PIN:</p>
<input type="password" id="pin" maxlength="6">
<br>
<button onclick="checkPin()">OK</button>
<p id="error" style="color:#f55;display:none">Incorrect PIN</p>
</div>
<div id="result">
<h3 style="text-align:center">Intercare Medical Certificate</h3>
<table>
<tr><td class="label">Practice</td><td>Intercare Irene</td></tr>
<tr><td class="label">Doctor</td><td>Dr. Ockie Vermeulen</td></tr>
<tr><td class="label">Patient</td><td>Mia Isabella Venter</td></tr>
<tr><td class="label">Date</td><td>11 November 2026</td></tr>
<tr><td class="label">To</td><td>13 November 2026</td></tr>
<tr><td class="label">Return</td><td>16 November 2026</td></tr>
</table>
  
</div>
</div>
<script>
const correctPin = "1234"; // change this
function checkPin(){
  const entered = document.getElementById('pin').value;
  if(entered === correctPin){
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('result').style.display = 'block';
  } else {
    document.getElementById('error').style.display = 'block';
  }
}
</script>
</body>
</html>
